especialista_nuevo: []
# Incremento 1 (US-001..005): ninguno requerido — WPF/.NET8 de escritorio + pipeline de
# GitHub Actions, cubierto por el catálogo genérico.
# Incremento 2 (US-006..008): tampoco. Evaluado explícitamente: US-006 es tooling
# PowerShell/CI (mismo lenguaje que ya usa publish.yml, dentro de la expertise esperable
# de un devops genérico); US-007/US-008 son WPF/XAML nativo sin librería nueva, mecanismo
# ya cerrado por el tech-spec. Ninguno cae en las categorías que ameritan
# especialista_nuevo (ML/Data Engineering, mobile nativo, embebido, blockchain,
# integraciones regulatorias complejas).
# Incremento 3 (US-009..011): tampoco. US-009 es C#/HTTP sobre un servicio ya existente,
# sin tocar el mecanismo de reintentos (no requiere expertise de ML — no se entrena ni
# ajusta ningún modelo, solo se consume un endpoint REST ya integrado); US-010 es
# housekeeping de repo (git/PowerShell); US-011 es XAML/color, dentro de la expertise
# esperable de un developer WPF genérico. Ninguno cae en las categorías que ameritan
# especialista_nuevo.
# Incremento 4 (US-008..013 del 01-spec.md vigente): tampoco. Evaluado explícitamente:
#  - Parser de Office = ZIP (System.IO.Compression) + XML (System.Xml) del framework, sin
#    dependencia nueva — dentro de la expertise de un developer .NET senior.
#  - Decodificación HEIC = consumir Magick.NET (una llamada: Read → Format=Png →
#    ToByteArray), no procesamiento/ciencia de imagen ni códecs propios.
#  - US-011 animaciones = WPF/XAML nativo (ya hecho en Inc-2 por developer genérico).
#  - US-009/US-010 no tocan el modelo de IA (endpoint Gemini ya integrado, no se entrena
#    ni ajusta nada) → no es Data/ML Engineering.
#  Ninguno cae en las categorías que ameritan especialista_nuevo (ML/Data Engineering,
#  mobile nativo, embebido, blockchain, integraciones regulatorias complejas).
