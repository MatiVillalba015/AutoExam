# Roster de instancias paralelas — deriva de specs/03-architecture.md
# Todos los roles reusan las plantillas genéricas del catálogo existente
# (developer, test-developer, devops), parametrizadas con stack_context.
# No se requiere ningún especialista_nuevo para este alcance (US-001 a US-005):
# es WPF/.NET8 de escritorio + un pipeline de GitHub Actions, cubierto por el
# catálogo genérico.

equipo:

  - id: devops-pipeline-publicacion
    rol_base: devops
    modulo: US-001 — Pipeline de publicación automática
    stack_context: >
      GitHub Actions, runner windows-latest (obligatorio: WPF no compila en Linux),
      PowerShell 7 (pwsh) reutilizando la lógica de comparación/empaquetado/regex de
      publicar.ps1, GitHub CLI (gh, preinstalado en el runner) para `gh release create`,
      dotnet SDK 8.0.x, permissions: contents: write a nivel de job, trigger
      `on: push branches:[main] paths-ignore:[update.xml]`.
    contrato_referencia: specs/03-architecture.md §4.1 (pasos 1-11, permisos, disparador)
    notas: >
      Bloqueado para validación en producción (no para diseño/implementación) por R-1:
      requiere que el usuario confirme Settings → Actions → General → Workflow permissions
      = Read and write, y ausencia de branch protection que impida push directo a main.
      Depende del paso "dotnet test" existiendo (ver test-dev-actualizacion, R-4).

  - id: test-dev-actualizacion
    rol_base: test-developer
    modulo: US-001 — Regresión de ActualizacionService + scaffold de tests (proyecto nuevo)
    stack_context: >
      xUnit 2.x, .NET 8 (net8.0-windows, sin UseWPF), proyecto nuevo AutoExam.Tests con
      ProjectReference a AutoExam/AutoExam.csproj, nuevo AutoExam.sln en la raíz
      (no existe hoy, hay que crearlo), dotnet test.
    contrato_referencia: >
      specs/03-architecture.md §1.3 y §6 (R-4); firmas públicas ya existentes en
      AutoExam/Services/ActualizacionService.cs: EsBucleDeActualizacion(AppConfig,string?),
      AnotarIntento(AppConfig,string), PaqueteDisponible(string?, out string) — NFR-13/AC-T5.
    notas: Trabajo contract-first, arranca junto con devops-pipeline-publicacion; es prerequisito del paso "dotnet test" del pipeline.

  - id: dev-dialogos-tema
    rol_base: developer
    modulo: US-002 — Diálogos y avisos temáticos
    stack_context: >
      .NET 8 / WPF, WPF-UI 4.3.0 (ventana o ContentDialog propio con estilo Fluent/Mica),
      CommunityToolkit.Mvvm 8.4.0, DynamicResource sobre Theme/Tokens.Claro.xaml /
      Theme/Tokens.Oscuro.xaml y estilos de Theme/Estilos.xaml (Tarjeta, Txt*).
    contrato_referencia: >
      specs/03-architecture.md §4.2 — interfaz IDialogos (AutoExam/Services/DialogoService.cs)
      sin cambio de firma; §3 (MessageBox.Show de App.xaml.cs y MainWindow.xaml.cs quedan
      explícitamente fuera de alcance).
    notas: Punto de inyección sin cambios (App.xaml.cs línea 41, new DialogoService()).

  - id: test-dev-dialogos-tema
    rol_base: test-developer
    modulo: US-002
    stack_context: xUnit, proyecto AutoExam.Tests (compartido, ver test-dev-actualizacion).
    contrato_referencia: >
      specs/03-architecture.md §4.2 — pruebas de contrato sobre IDialogos.Confirmar/Aviso/Error
      (tipo de retorno, no-throw) sin levantar ventana real; AC-T6/AC-T7.
    notas: Arranca junto con dev-dialogos-tema, contract-first sobre la firma de IDialogos.

  - id: dev-ventana-navegacion
    rol_base: developer
    modulo: US-003 + US-004 — Geometría de ventana y navegación por teclado (mismo owner: comparten MainWindow.xaml/.xaml.cs)
    stack_context: >
      .NET 8 / WPF, System.Windows.Forms.Screen vía <UseWindowsForms>true</UseWindowsForms>
      en AutoExam.csproj (ya viene transitivamente por AutoUpdater.NET.Official, sin costo
      nuevo real), CommunityToolkit.Mvvm 8.4.0 (RelayCommand ya existente ShellViewModel.IrA),
      JsonStore/AppConfig ya existente.
    contrato_referencia: >
      specs/03-architecture.md §4.3 (campos AppConfig VentanaAncho/Alto/X/Y/Estado, tipos y
      defaults ya fijados) y §4.4 (claves reales de Paginas: libros/nuevo/examen/historial/
      ajustes; atajos Ctrl+1..Ctrl+5; Window.InputBindings en MainWindow.xaml, no en
      ExamenView.xaml).
    notas: No paralelizado en dos instancias a propósito (ver §5 de la arquitectura) — ambas US tocan los mismos dos archivos.

  - id: test-dev-ventana-navegacion
    rol_base: test-developer
    modulo: US-003 + US-004
    stack_context: xUnit, proyecto AutoExam.Tests (compartido).
    contrato_referencia: >
      specs/03-architecture.md §4.3/§4.4 — AC-T8/AC-T9 (geometría y fallback fuera de pantalla,
      extraer la lógica de intersección con Screen.WorkingArea a un método testable) y
      AC-T10/AC-T11/AC-T12 (suite de regresión de KeyBinding de Views/ExamenView.xaml: 1-4,
      NumPad1-4, A-D, Right, Enter, Left, S — NFR-09; no disparo en foco de TextBox — NFR-10).
    notas: La suite de regresión de ExamenView.xaml es crítica y debe existir ANTES de que dev-ventana-navegacion agregue los atajos nuevos.

  - id: dev-tamanio-texto-examen
    rol_base: developer
    modulo: US-005 — Tamaño de texto ajustable en examen
    stack_context: >
      .NET 8 / WPF, CommunityToolkit.Mvvm 8.4.0, binding directo FontSize en
      Views/ExamenView.xaml a propiedades de ExamenViewModel (no a Theme/Estilos.xaml).
    contrato_referencia: >
      specs/03-architecture.md §4.5 — AppConfig.TamanioTextoExamen (int 0..4, default 2),
      ExamenViewModel.TamanioTextoPregunta/TamanioTextoOpciones, nivel 2 debe mapear a los
      tamaños actuales (17pt/14pt) para no romper el look por defecto.
    notas: No toca Theme/Tokens.* ni TamEnunciado/TamCuerpo globales (se usan en otras vistas).

  - id: test-dev-tamanio-texto-examen
    rol_base: test-developer
    modulo: US-005
    stack_context: xUnit, proyecto AutoExam.Tests (compartido).
    contrato_referencia: >
      specs/03-architecture.md §4.5 — mapeo nivel→pt (5 niveles), persistencia de
      AppConfig.TamanioTextoExamen entre reinicios (AC-T14), ausencia de scroll horizontal
      es responsabilidad de qa (visual, fuera de alcance de test-developer).

  # ---------------------------------------------------------------------------
  # Incremento 2 (US-006 a US-008) — deriva de specs/03-architecture.md,
  # sección "Incremento 2". US-001 a US-005 ya cerradas arriba, no se reabren.
  # Dos frentes sin archivos en común, 100% paralelizables entre sí:
  # "versionado" (US-006, devops) y "animaciones de shell" (US-007+US-008,
  # developer). No se separan US-007/US-008 en dos developers a propósito:
  # ambas tocan Theme/Estilos.xaml (ver §4 de la arquitectura, incremento 2).
  # ---------------------------------------------------------------------------

  - id: devops-verificacion-version
    rol_base: devops
    modulo: US-006 — Chequeo local de versión (script) + ajuste puntual de publish.yml para no duplicar lógica
    stack_context: >
      PowerShell 7 (pwsh, mismo lenguaje que ya usa publish.yml), sin librerías nuevas;
      script Verificar-Version.ps1 en la raíz del repo junto a publicar.ps1; edición de
      un único step existente de .github/workflows/publish.yml (reemplaza el bloque
      inline por una invocación al script con -EmitGithubOutput, mismo id/outputs).
    contrato_referencia: >
      specs/03-architecture.md (Incremento 2) §3.1 (contrato exacto de
      Verificar-Version.ps1: parámetros, mensajes de consola, códigos de salida 0/1/2,
      outputs con -EmitGithubOutput) y §3.2 (ajuste al step "Comparar version del
      proyecto vs. update.xml"); specs/02-tech-spec.md Incremento 2, "Decisiones de
      diseño" (US-006).
    notas: >
      No bloqueado por R-1 del incremento 1 (permisos del repo) — este script no publica
      ni hace push, corre 100% local/CI sin red. Coordina con
      test-dev-verificacion-version (contract-first sobre el formato de mensajes/exit
      codes, ya cerrado en el contrato referenciado).

  - id: test-dev-verificacion-version
    rol_base: test-developer
    modulo: US-006
    stack_context: >
      xUnit, proyecto AutoExam.Tests ya existente (no se crea uno nuevo ni se suma
      Pester — ver specs/03-architecture.md Incremento 2 §1.1); invocación de
      Verificar-Version.ps1 como proceso hijo (System.Diagnostics.Process) contra
      pares de AutoExam.csproj/update.xml de fixture en un directorio temporal por
      test, aserciones sobre stdout exacto y exit code.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 2) §3.1; specs/02-tech-spec.md Incremento 2
      AC-T15/AC-T16/AC-T17/AC-T18, NFR-14/NFR-15/NFR-16.
    notas: Arranca junto con devops-verificacion-version, contract-first sobre el formato de mensaje/exit code ya cerrado en §3.1 — no necesita esperar a que el script esté terminado para empezar a escribir los tests.

  - id: dev-animaciones-shell
    rol_base: developer
    modulo: US-007 + US-008 — Transición de sección y feedback de hover/presión (mismo owner: ambas tocan Theme/Estilos.xaml, ver §4 de la arquitectura del incremento 2)
    stack_context: >
      .NET 8 / WPF nativo, sin librerías de comportamientos de terceros
      (Microsoft.Xaml.Behaviors descartado por el tech-spec); DependencyPropertyDescriptor
      sobre ContentControl.Content (AutoExam/Behaviors/TransicionContenido.cs, ya existe,
      requiere completarse según tech-spec Incremento 2 "Decisiones de diseño" US-007);
      Trigger.EnterActions/ExitActions + Storyboard (no VisualStateManager) sobre los 7
      ControlTemplate de AutoExam/Theme/Estilos.xaml (Chip, ChipAccion, OpcionExamen,
      BaldosaPregunta, ItemNavegacion, ItemLibro, ZonaSoltar), reusando
      DuracionHover/DuracionPresion/SuavizadoSalida ya declarados.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 2) §3.3/§3.4; specs/02-tech-spec.md Incremento 2
      "Decisiones de diseño" (US-007 y US-008: mecanismo de overlay hover/ScaleTransform
      press, MultiTrigger de IsEnabled, restricción dura de no animar Brush/Color directo
      — NFR-23).
    notas: >
      No requiere tocar MainWindow.xaml (wiring de US-007 ya completo). No se paraleliza
      en dos instancias a propósito: separar US-007 de US-008 en dos developers generaría
      edición concurrente de Theme/Estilos.xaml sin bajar tiempo real — mismo criterio que
      el incremento 1 aplicó a MainWindow.xaml (US-003+US-004).

  - id: test-dev-animaciones-shell
    rol_base: test-developer
    modulo: US-007 + US-008
    stack_context: >
      xUnit, proyecto AutoExam.Tests (compartido); tests estructurales sobre el XAML de
      Theme/Estilos.xaml y MainWindow.xaml (parseo con System.Xml.Linq, sin runtime WPF
      headless) — verificables sin levantar ventana.
    contrato_referencia: >
      specs/02-tech-spec.md Incremento 2, AC-T19 a AC-T26, NFR-17 a NFR-23. Cobertura
      automatizable: AC-T22 (ningún ContentControl de Views/ExamenView.xaml usa
      TransicionContenido.Activa — verificación estructural), NFR-20/NFR-21 (los 7
      templates referencian {DynamicResource DuracionHover}/{DynamicResource
      DuracionPresion}, 0 valores hardcodeados), NFR-22 (guardia IsEnabled=True presente
      en los 7 MultiTrigger de hover/press), NFR-23 (0 ColorAnimation/BrushAnimation sobre
      Background/Fill/Stroke en los templates tocados). AC-T19/AC-T21/AC-T23/AC-T24
      (duración real percibida, ausencia de superposición en navegación rápida) quedan
      fuera de lo automatizable por xUnit — ver riesgo R-8 y sugerencia de QA manual en
      specs/03-architecture.md (Incremento 2) §5.
    notas: Arranca junto con dev-animaciones-shell, contract-first sobre los nombres de recursos y la guardia MultiTrigger ya cerrados en el tech-spec.

  # ---------------------------------------------------------------------------
  # Incremento 3 (US-009 a US-011) — deriva de specs/03-architecture.md,
  # sección "Incremento 3". Tres frentes SIN archivos en común entre sí
  # (GeminiApiService.cs / .gitignore+árbol / Tokens.*.xaml), 100%
  # paralelizables entre sí — a diferencia de los incrementos 1 y 2, ninguno
  # comparte owner por archivo compartido dentro de este incremento.
  # ---------------------------------------------------------------------------

  - id: dev-generacion-gemini
    rol_base: developer
    modulo: US-009 — Confiabilidad de generación con Gemini (techo de tokens proactivo + mensaje que distingue causa)
    stack_context: >
      .NET 8, System.Net.Http/System.Text.Json ya usados por GeminiApiService.cs (sin
      librerías nuevas); único archivo tocado: AutoExam/Services/GeminiApiService.cs
      (GenerarPreguntasAsync, DiagnosticoGeneracion, ArmarMensajeSinPreguntas). No se toca
      lotes adaptativos, rotación de claves, backoff ni semáforo de turno (restricción
      dura del tech-spec). Estilo trainee: extender métodos/campos existentes, sin
      interfaces/factories/patrones nuevos.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 3) §3 y §4.1 — punto de inserción exacto de la
      consulta proactiva a ListarModelosAsync (tras ArmarAnillo, antes de
      SubirPdfSiConvieneAsync), snippet de código, y los dos campos nuevos de
      DiagnosticoGeneracion (LotesTruncados, CuotaDiariaDetectada) con las oraciones
      exactas que consume ArmarMensajeSinPreguntas; specs/02-tech-spec.md Incremento 3
      AC-T27 a AC-T31, NFR-24 a NFR-28.
    notas: >
      No persiste el aprendizaje entre sesiones en este incremento (decisión §1.1 de la
      arquitectura — mejora opcional descartada por costo/beneficio, no bloqueante).
      IProgress<string> ya está cableado en AsistenteViewModel.cs, no requiere cambios.

  - id: test-dev-generacion-gemini
    rol_base: test-developer
    modulo: US-009
    stack_context: >
      xUnit, proyecto AutoExam.Tests (compartido); tests unitarios sobre
      DiagnosticoGeneracion (campos nuevos, Resumen()) y sobre la lógica pura de
      ArmarMensajeSinPreguntas/CalcularTopeTokens sin llamar a la API real de Gemini
      (dobles/valores directos sobre los campos static existentes, mismo patrón que
      permitió el comentario original "Existe para las pruebas, porque son campos
      estaticos").
    contrato_referencia: >
      specs/03-architecture.md (Incremento 3) §4.1; specs/02-tech-spec.md Incremento 3
      AC-T27 a AC-T31. AC-T27/AC-T29/AC-T31 (tasa de éxito real de 30 preguntas,
      repetibilidad) requieren corridas contra la API real o un doble que simule
      truncado/429 — a definir con QA si el doble se arma en este incremento o se deja
      como prueba manual (ver riesgo NFR-25 del tech-spec, no resuelto por xUnit puro).
    notas: Arranca junto con dev-generacion-gemini, contract-first sobre los nombres de los dos campos nuevos de DiagnosticoGeneracion.

  - id: devops-housekeeping-repo
    rol_base: devops
    modulo: US-010 — Housekeeping de repo (gitignore + auditoría de menciones a IA)
    stack_context: >
      Git/PowerShell, sin dependencias nuevas; corrige la línea corrupta de .gitignore
      (raíz del repo) agrupándola junto a la entrada .agents/ ya existente; ejecuta
      búsqueda de texto (git grep -i -e claude -e anthropic o equivalente) sobre el árbol
      completo trackeado y no trackeado, excluyendo .git/, bin/, obj/,
      AutoExam/publish/, release/. No toca historial de commits (restricción dura).
    contrato_referencia: >
      specs/03-architecture.md (Incremento 3) §3 y §4.2 (línea exacta de reemplazo en
      .gitignore, criterio de verificación git check-ignore/git status --porcelain);
      specs/02-tech-spec.md Incremento 3, tabla "US-010 — checklist vital vs. no vital"
      (Decisiones de diseño) — no se reinterpreta acá; AC-T32 a AC-T35, NFR-29/NFR-30/NFR-31.
    notas: >
      R-11 (arquitectura): debe repetir la búsqueda de texto con herramienta real como
      primer paso, documentando el conteo "antes" (ver sugerencia final de la
      arquitectura, Incremento 3). Cualquier archivo vital con mención a IA se edita para
      quitar solo la mención, nunca se borra ni se vacía.

  - id: test-dev-housekeeping-repo
    rol_base: test-developer
    modulo: US-010
    stack_context: >
      xUnit, proyecto AutoExam.Tests (compartido); invocación de `git check-ignore -v
      .claude` y `git status --porcelain` como proceso hijo (mismo patrón que
      test-dev-verificacion-version del incremento 2) para verificar NFR-30 de forma
      repetible; dotnet build/dotnet test como gate de NFR-31 ya lo cubre el pipeline
      existente (incremento 1), no se duplica acá.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 3) §4.2; specs/02-tech-spec.md Incremento 3
      AC-T32/AC-T35, NFR-29/NFR-30. AC-T33 (0 resultados de búsqueda de texto amplia)
      queda a cargo de devops-housekeeping-repo, no es un test automatizado permanente en
      CI — es un paso de verificación puntual antes de cerrar la US.
    notas: Arranca junto con devops-housekeeping-repo, sobre el contrato de .gitignore ya cerrado en §4.2.

  - id: dev-paleta-morada
    rol_base: developer
    modulo: US-011 — Rediseño visual morado/suave (superficie/borde + contraste)
    stack_context: >
      .NET 8 / WPF, XAML puro; único archivo tocado por diseñador: valores Color de
      AutoExam/Theme/Tokens.Claro.xaml y AutoExam/Theme/Tokens.Oscuro.xaml (20 claves
      existentes, mismos nombres, sin agregar claves nuevas — decisión §1.2 de la
      arquitectura); no toca Theme/Estilos.xaml ni TemaService.Aplicar; no mueve el matiz
      de PincelAcierto*/PincelError*/PincelPendiente* hacia el violeta.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 3) §4.3 — tabla de pares de contraste a
      cumplir (NFR-32/NFR-33/NFR-34), restricción dura de no mover el hue semántico;
      specs/02-tech-spec.md Incremento 3, "Decisiones de diseño" US-011, AC-T36 a AC-T39.
    notas: >
      Re-tonaliza las 6 claves de superficie/borde existentes (Fondo, Superficie, Tarjeta,
      TarjetaHover, Borde, BordeFuerte) hacia un gris con temperatura violeta sutil, en
      ambos diccionarios en paralelo (mismo developer, ver §5 de la arquitectura — evita
      desincronizar NFR-35). Itera valores hasta que el test de contraste de
      test-dev-paleta-morada pase.

  - id: test-dev-paleta-morada
    rol_base: test-developer
    modulo: US-011
    stack_context: >
      xUnit, proyecto AutoExam.Tests (compartido); parseo de Tokens.Claro.xaml/
      Tokens.Oscuro.xaml con System.Xml.Linq (mismo enfoque que test-dev-animaciones-shell
      del incremento 2 para XAML estructural, sin runtime WPF); función pura de contraste
      WCAG 2.1 (luminancia relativa) escrita en el propio proyecto de test, sin librería
      nueva.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 3) §4.3 — tabla exacta de pares y umbrales a
      testear (NFR-32/NFR-33/NFR-34/NFR-35), restricción de hue semántico (AC-T39);
      specs/02-tech-spec.md Incremento 3 AC-T36 a AC-T39.
    notas: >
      Este test es el gate objetivo de accesibilidad de US-011 — arranca junto con
      dev-paleta-morada, contract-first sobre la tabla de pares (no necesita esperar los
      valores finales de color para escribir la función de contraste y las aserciones).

  # ---------------------------------------------------------------------------
  # Incremento 4 (US-008 a US-013 del 01-spec.md VIGENTE) — deriva de
  # specs/03-architecture.md, sección "Incremento 4". 5 módulos de developer:
  #   M1 extraccion-multiformato · M2 fuentes-imagen-heic · M3 modelo-fuente-biblioteca
  #   M4 ingesta-y-alcance · M5 resultado-historial-animaciones
  # M1/M2/M3 no comparten archivos entre sí; M2/M3/M4 trabajan contra el CONTRATO
  # de M1 (IExtractorContenido, §4.1), no contra su código → contract-first.
  # M5 concentra US-011+US-012+US-013 en un solo owner porque comparten
  # ExamenView.xaml / ExamenViewModel.cs / HistorialView.xaml (precedente Inc-1 §5,
  # Inc-2 §4). ShellViewModel.cs lo tocan M4 y M5 en regiones distintas ya cerradas
  # (arquitectura §5, incremento 4).
  # ---------------------------------------------------------------------------

  - id: dev-extraccion-multiformato
    rol_base: developer
    modulo: US-008 + US-009 (M1) — Pipeline de extracción multi-formato (interfaz, factory, adapter PDF, OfficeExtractor)
    stack_context: >
      .NET 8, C#; SIN dependencias nuevas. System.IO.Compression.ZipArchive +
      System.Xml.XmlReader (forward-only, una ZipArchiveEntry por vez — NFR-39) para
      .docx (word/document.xml), .xlsx (xl/sharedStrings.xml + xl/worksheets/sheet*.xml),
      .pptx (ppt/slides/slide*.xml). Archivos NUEVOS en AutoExam/Services/:
      IExtractorContenido, FactoriaExtractores, PdfExtractor (adapter que envuelve el
      PdfExtractorService actual SIN tocarlo), OfficeExtractor, MedidaFuente, RecorteFuente,
      FormatoNoSoportadoException, FuenteIlegibleException. Reusa ExtraccionResultado /
      OpcionesExtraccion / RangoPaginas / ImagenExtraida tal cual. Agrega el enum
      TipoFuente a AutoExam/Models/Enums.cs. Estilo: código imperativo directo, factory
      por extensión (no motor de plugins), extender lo que existe.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 4) §1.2, §3, §4.1, §6 (NFR-A3/A5/A7), §7 (R-17,
      R-18); specs/02-tech-spec.md "Contratos de integración" US-008/009/010 y
      "Restricciones técnicas" (parsing de Office); NFR-38/NFR-39/NFR-40/NFR-41, AC-T40 a
      AC-T47.
    notas: >
      Publica el contrato de §4.1 (ya cerrado en la arquitectura) el día 1 para desbloquear
      a M2/M3/M4. PdfExtractorService.cs es intocable — sólo se lo envuelve. Los 4
      call-sites que hoy hacen `new PdfExtractorService()` deben seguir compilando (NFR-A5).

  - id: test-dev-extraccion-multiformato
    rol_base: test-developer
    modulo: US-008 + US-009 (M1)
    stack_context: >
      xUnit, proyecto AutoExam.Tests (compartido); fixtures reales .docx/.xlsx/.pptx
      (chico, grande ≥ 500 páginas equivalentes, sin texto extraíble, protegido con
      contraseña) generados o versionados como recurso de test; helper ArchivoFuenteHelper
      ya existente; medición de pico de RAM del proceso para NFR-39 (comparar archivo
      chico vs. grande). Sin runtime WPF.
    contrato_referencia: >
      specs/03-architecture.md (Incremento 4) §4.1, §6 (NFR-A3); specs/02-tech-spec.md
      NFR-38/NFR-39/NFR-40/NFR-41, AC-T41/AC-T42/AC-T43/AC-T44/AC-T47. Cubre:
      MedirAsync devuelve una medida por formato (0 fuentes sin medida), .doc/.xls/.ppt y
      extensión desconocida → FormatoNoSoportadoException con mensaje esperado, archivo
      protegido/dañado → FuenteIlegibleException con causa, Office sin texto → resultado
